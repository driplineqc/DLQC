<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLQC | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<button onclick="logout()" id="logout-btn" class="floating-logout">
    <i class="fas fa-sign-out-alt"></i>
    <span>Déconnexion</span>
</button>

<body class="admin-body">

    <a href="index.html" class="back-to-site">
        <i class="fas fa-arrow-left"></i> REVENIR AU SITE
    </a>
    
    <div id="login-zone" class="login-overlay">
        <div class="login-card">
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="admin-pass" placeholder="Entrez le code secret...">
            </div>
            <button onclick="checkAdmin()" class="btn-primary">DÉVERROUILLER L'ACCÈS</button>
        </div>
    </div>

    <div id="admin-content" class="dashboard-container" style="display:none;">
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="form-group">
                    <label>Nom de l'article</label>
                    <input type="text" id="album-name" placeholder="Ex: Jordan 4 Retro Black Cat">
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="album-category">
                        <option value="shoes">Chaussures</option>
                        <option value="clothes">Vêtements</option>
                        <option value="acc">Accessoires</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description & Détails </label>
                    <textarea id="album-desc" rows="4" placeholder="Matériaux,Taille,Couleur"></textarea>
                </div>
                
                <div class="form-group">
    <label class="file-label">
        <i class="fas fa-cloud-upload-alt"></i> Sélectionner les photos
        <input type="file" id="photo-input" multiple accept="image/*" onchange="previewImages()">
    </label>
</div>
<div id="publish-preview-zone" class="preview-grid" style="margin-bottom: 20px;">
</div>

<button onclick="handlePublish()" id="publish-btn" class="btn-publish-final">PUBLIER SUR DLQC</button>

            <div class="dashboard-card">
                <h3><i class="fas fa-boxes"></i> En ligne</h3>
                <div id="admin-inventory-list" class="inventory-scroll">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="script.js"></script>

</body>
</html>
