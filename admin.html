<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLQC | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="admin-body">

    <button id="logout-btn" class="floating-logout" onclick="logout()" style="display:none;">
        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
        <span>Déconnexion</span>
    </button>

    <a href="index.html" class="back-to-site">
        <i class="fas fa-arrow-left" aria-hidden="true"></i> REVENIR AU SITE
    </a>

<section id="login-zone" class="login-overlay">
    <form class="login-card" onsubmit="event.preventDefault(); checkAdmin();">
        <div class="input-group">
            <i class="fas fa-lock" aria-hidden="true"></i>
            <input type="password" id="admin-pass" placeholder="Entrez le code secret..." aria-label="Code secret admin" required>
        </div>
        <button type="submit" class="btn-primary">DÉVERROUILLER L'ACCÈS</button>
    </form>
</section>

    <main id="admin-content" class="dashboard-container" style="display:none;">
        <div class="dashboard-grid">
        

            <form id="publish-form" class="dashboard-card" onsubmit="event.preventDefault(); handlePublish();">
                <h2><i class="fas fa-plus-circle" aria-hidden="true"></i> Publier un article</h2>

                <div class="form-group">
                    <label for="album-name">Nom de l'article</label>
                    <input type="text" id="album-name" placeholder="Ex: Jordan 4 Retro Black Cat" required>
                </div>

                <div class="form-group">
                    <span class="label-emulated">Catégorie</span>
                    <div class="category-selector">
                        <input type="radio" id="cat-shoes" name="category" value="shoes" checked>
                        <label for="cat-shoes">Chaussures</label>
                        
                        <input type="radio" id="cat-clothes" name="category" value="clothes">
                        <label for="cat-clothes">Vêtements</label>
                        
                        <input type="radio" id="cat-acc" name="category" value="acc">
                        <label for="cat-acc">Accessoires</label>
                    </div>
                </div>

                <div class="form-group">
                    <span class="label-emulated">Qualité</span>
                    <div class="quality-selector">
                        <input type="checkbox" id="q-medium" value="Medium">
                        <label for="q-medium">Medium</label>
                        
                        <input type="checkbox" id="q-superior" value="Supérieur">
                        <label for="q-superior">Supérieur</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="album-colors">Couleurs (séparées par une virgule)</label>
                    <input type="text" id="album-colors" placeholder="Rouge, Marron...">
                </div>

                <div class="form-group">
                    <label for="album-desc">Description (Autres détails)</label>
                    <textarea id="album-desc" rows="3" placeholder="Informations complémentaires..."></textarea>
                </div>

                <div class="form-group">
    <span class="label-emulated">Amélioration d'image</span>
    <div class="enhancer-toggle-container">
        <label class="switch-label" for="enhance-toggle">
            <input type="checkbox" id="enhance-toggle" checked>
            <span class="slider"></span>
        </label>
        <span class="switch-text">Activer le filtre de netteté pure (Sharpen)</span>
    </div>
</div>

               <div class="form-group">
    <label class="file-label" for="photo-input">
        <i class="fas fa-cloud-upload-alt" aria-hidden="true"></i> Sélectionner les photos
        <input type="file" id="photo-input" multiple accept="image/*">
    </label>
</div>
                
                <div id="publish-preview-zone" class="preview-grid" aria-live="polite"></div>
                
                <button type="button" onclick="handlePublish()" id="publish-btn" class="btn-publish-final">PUBLIER SUR DLQC</button>
            </form>

            <section class="dashboard-card">
                <h3><i class="fas fa-boxes" aria-hidden="true"></i> En ligne</h3>
                <div id="admin-inventory-list" class="inventory-scroll" aria-live="polite">
                </div>
            </section>

        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="script.js"></script>

</body>
</html>
